# Connector jars, resolved from Maven on first run (cached in the ivy-cache volume).
#  - spark-sql-kafka : Kafka source/sink          (must match Spark + Scala version: 3.5.3 / 2.12)
#  - hadoop-aws      : s3a:// filesystem          (must match Hadoop bundled with Spark: 3.3.4)
spark.jars.packages                 org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4
spark.jars.ivy                      /tmp/ivy
spark.master                        local[2]
spark.driver.memory                 1g
spark.sql.session.timeZone          UTC
# Small data: 200 shuffle partitions (default) would create 200 tiny state-store partitions.
# NOTE: this value is baked into the checkpoint of stateful queries and cannot be changed later.
spark.sql.shuffle.partitions        4
spark.sql.streaming.stateStore.providerClass  org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
